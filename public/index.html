<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>Dayloop</title>
  <meta name="theme-color" content="#EEF1EC" media="(prefers-color-scheme: light)">
  <meta name="theme-color" content="#121A18" media="(prefers-color-scheme: dark)">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-title" content="Dayloop">
  <meta name="apple-mobile-web-app-status-bar-style" content="default">
  <link rel="manifest" href="manifest.webmanifest">
  <link rel="apple-touch-icon" href="icon-180.png">
  <link rel="icon" href="icon.svg" type="image/svg+xml">
  <link rel="stylesheet" href="styles.css">
</head>
<body>
  <main id="view" aria-live="polite"></main>

  <nav class="tabs" aria-label="Sections">
    <a href="#plan" data-tab="plan">Plan</a>
    <a href="#tasks" data-tab="tasks">Tasks</a>
    <a href="#habits" data-tab="habits">Habits</a>
    <a href="#hours" data-tab="hours">Hours</a>
    <a href="#settings" data-tab="settings">Settings</a>
  </nav>

  <button class="add" id="add" type="button" aria-label="Add">+</button>

  <dialog id="sheet" class="sheet"></dialog>
  <div id="toast" class="toast" role="status" hidden></div>

  <script src="app.js" type="module"></script>
</body>
</html>
